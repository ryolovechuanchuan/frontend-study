<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Day85_Expense_Planner</title>
  </head>
  <body>
    <h1>Expense Planner</h1>
    <h2>Expenses</h2>
    <div id="filterArea">
      <button id="allBtn">All</button>
      <button id="foodBtn">Food</button>
      <button id="transportBtn">Transport</button>
    </div>

    <ul id="expenseList"></ul>

    <div class="input-area">
      <input type="text" id="titleInput" placeholder="Title" />

      <input type="number" id="amountInput" placeholder="Amount" />

      <select name="category" id="categorySelect">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
      </select>

      <input type="text" id="dateInput" placeholder="1990-10-10" />
    </div>

    <button id="addBtn">Add Expense</button>
    <h2>Total: $<span id="totalAmount">0</span></h2>

    <script type="module" src="./script.js"></script>
  </body>
</html>
